[project]
name = "syncalist"
dynamic = ["version"]
description = "Keep Plex Home music playlists in sync between users"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlmodel>=0.0.22",
    "plexapi>=4.15",
    "httpx>=0.27",
    "cryptography>=43",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["syncalist*"]

[tool.setuptools.dynamic]
version = {attr = "syncalist.__version__"}

[tool.setuptools.package-data]
syncalist = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
