<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Syncalist{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/site.webmanifest">
  <meta name="theme-color" content="#e5a00d">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><img src="/static/logo-small.svg" width="28" height="28" alt=""> Syncalist</a>
    {% if signed_in %}
    <nav>
      <a href="/">Playlists{% if attention %} <span class="badge" title="{{ attention }} shared playlist{{ 's' if attention != 1 }} need{{ 's' if attention == 1 }} attention">{{ attention }}</span>{% endif %}</a>
      <a href="/history">History</a>
      <a href="/settings">Settings</a>
      <form method="post" action="/logout"><button class="link">Sign out</button></form>
    </nav>
    {% endif %}
  </header>
  <main>
    {% for f in flashes %}<div class="flash {{ f.kind }}">{{ f.message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer>Syncalist {{ version }}</footer>
</body>
</html>
