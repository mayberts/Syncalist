name: Docker image

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to create the vX.Y.Z git tag on release
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/syncalist

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Tag must match the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app=$(python -c "import syncalist; print(syncalist.__version__)")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$app" != "$tag" ]; then
            echo "::error::Tag v$tag doesn't match syncalist.__version__ ($app). Bump the version first."
            exit 1
          fi

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image name must be lower case
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Is this a new release?
        id: rel
        # On the default branch, a version that has no published image yet is a release.
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' syncalist/__init__.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$IMAGE:$version" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "$version is already published; this push only updates latest."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing $version"
          fi
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref_name != github.event.repository.default_branch }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.rel.outputs.version }},enable=${{ steps.rel.outputs.release == 'true' }}
            type=raw,value=${{ steps.rel.outputs.minor }},enable=${{ steps.rel.outputs.release == 'true' }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tag the release in git
        if: steps.rel.outputs.release == 'true'
        run: |
          tag="v${{ steps.rel.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi
